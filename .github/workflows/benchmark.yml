# Measure pyegui against plain egui, and write bench/results.json.
#
# The README quotes a comparison, so something has to produce it. This builds the
# Rust baseline and runs the Python benchmark against the same wheel CI already
# builds, then writes both numbers to a single file with the ratio computed, so
# the README's table is a transcription of a run rather than an assertion.
#
# Manual only. A benchmark is slower than a test and its result is not
# pass/fail -- a noisy runner would make this a source of random red. It runs on
# demand and publishes an artifact.
#
# Both sides do identical work: 500 labels per frame, 60 frames, timed around
# building the frame's widgets rather than around the whole frame. The
# difference between them is what the binding costs.

name: benchmark

on:
  workflow_dispatch:
    inputs:
      widgets:
        description: 'Widgets per frame, comma separated (e.g. 50,500,2000)'
        required: false
        default: '50,500,2000'
      trials:
        description: 'Repeats per widget count. >1 reports a median and spread.'
        required: false
        default: '5'

permissions:
  contents: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: pyegui vs egui
    runs-on: ubuntu-22.04
    # 30 min covered the eframe release build with time to spare when one trial
    # was measured. Each count costs roughly 100s across both languages, so the
    # default of 5 trials at 3 counts is ~25 min of measurement on top of a
    # ~4 min build. Raised rather than left to discover as a timeout, which
    # would look like a benchmark failure rather than a budget one.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # eframe builds with the `glow` backend and needs a real GL context; Mesa's
      # software rasteriser is what actually draws on a runner.
      - name: Install Xvfb and the software OpenGL stack
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils libgl1-mesa-dri mesa-utils \
            libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 libxinerama1

      - name: Install the wheel under test
        run: |
          set -euo pipefail
          python -m venv .venv-bench
          # shellcheck disable=SC1091
          source .venv-bench/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.8,<2.0"
          maturin build --release --locked --out dist --find-interpreter
          wheel=$(ls -1 dist/pyegui-*.whl)
          echo "installing ${wheel}"
          python -m pip install --force-reinstall "${wheel}"

      - name: Run both benchmarks
        env:
          DISPLAY: ':99'
          WIDGETS: ${{ inputs.widgets }}
          TRIALS: ${{ inputs.trials }}
        run: |
          set -euo pipefail

          # shellcheck disable=SC1091
          source .venv-bench/bin/activate

          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill $xvfb_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          xdpyinfo -display :99 >/dev/null

          mkdir -p bench/results

          # Overhead scales with widget count, so one figure at one count
          # describes no other count. The input is a comma separated list and
          # every count is measured in this one run: a ratio measured on a
          # different day on a different runner is not comparable to one taken
          # today, which is the whole reason the README quotes ratios.
          #
          # TRIALS repeats each count within that one run, because three runs
          # of identical code gave 1.30x, 1.52x and 1.38-1.55x. One sample per
          # count cannot tell a real difference from runner noise.
          WIDGET_COUNTS="${WIDGETS:-500}"
          # Blank entries, e.g. "50,,2000" or a trailing comma from a copy/paste.
          WIDGET_COUNTS="$(printf '%s' "$WIDGET_COUNTS" | tr ',' ' ')"
          for count in $WIDGET_COUNTS; do
            case "$count" in
              ''|*[!0-9]*)
                echo "widget counts must be positive integers, got '$count'" >&2
                exit 2
                ;;
            esac
            if [ "$count" -lt 1 ]; then
              echo "widget count must be at least 1, got '$count'" >&2
              exit 2
            fi
          done
          if [ -z "$(printf '%s' "$WIDGET_COUNTS" | tr -d ' ')" ]; then
            echo "no widget count given" >&2
            exit 2
          fi
          # A blank input means "not supplied", so it defaults to 1. Rejecting
          # it would fail the run for someone who cleared the dispatch field,
          # which is the same thing as leaving it alone.
          case "${TRIALS:-1}" in
            *[!0-9]*)
              echo "trials must be a positive integer, got '${TRIALS}'" >&2
              exit 2
              ;;
          esac
          if [ "${TRIALS:-1}" -lt 1 ]; then
            echo "trials must be at least 1, got '${TRIALS}'" >&2
            exit 2
          fi
          echo "widget counts: ${WIDGET_COUNTS}  trials: ${TRIALS:-1}"

          # import cost, in a fresh interpreter so the module is not already up
          python -c "
          import json, subprocess, sys, time
          # Run in a child so the measurement is a cold import.
          code = 'import time; t=time.perf_counter(); import pyegui; print((time.perf_counter()-t)*1000)'
          best = None
          for _ in range(7):
              out = subprocess.run([sys.executable, '-c', code], capture_output=True, text=True, check=True)
              v = float(out.stdout.strip())
              best = v if best is None else min(best, v)
          json.dump({'import_pyegui_ms': round(best, 3)}, open('bench/results/import.json', 'w'))
          print('import pyegui:', round(best, 3), 'ms')
          "

          # Both sides are timed from the same loop, and each count gets its own
          # files, so a second count cannot overwrite the first. The Rust binary
          # is built once, outside the loop: cargo caches it, and an unbuilt
          # release binary would otherwise be compiled inside the measured run.
          # The binary is named after the package (pyegui-bench), not `bench`.
          cargo build --release --quiet --manifest-path bench/Cargo.toml
          test -x bench/target/release/pyegui-bench

          # Trials are the outer loop and widget counts the inner one, so every
          # count is measured once per trial in the same time window. The
          # reverse order measures 50 widgets while the machine is idle and
          # 2000 while it is warm, which is indistinguishable from a real
          # effect of widget count.
          #
          # Bounded, so a stall surfaces as a timeout rather than a hung job:
          # an earlier attempt sat for 25 minutes with no output. `set -o
          # pipefail` is already on, so a timeout fails the step rather than
          # being masked by tee's exit status -- otherwise a killed benchmark
          # would write a truncated file and the combine step would read a
          # half-finished run as if it were a result.
          for trial in $(seq 1 "${TRIALS:-1}"); do
            for count in $WIDGET_COUNTS; do
              echo "=== trial ${trial}/${TRIALS:-1}, ${count} widgets per frame ==="

              WIDGETS="${count}" timeout 300 python bench/bench.py \
                | tee "bench/results/pyegui-${count}-t${trial}.json"

              WIDGETS="${count}" timeout 600 bench/target/release/pyegui-bench \
                | tee "bench/results/egui-${count}-t${trial}.json"
            done
          done

      - name: Combine and compare
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import re
          import statistics

          results = pathlib.Path("bench/results")
          imp = json.loads((results / "import.json").read_text())

          # Files are named `pyegui-<count>-t<trial>.json`. Both parts are parsed
          # back out rather than trusted from the name alone, and the payload's
          # own widgets_per_frame is checked against the name -- a file written
          # under the wrong name would otherwise silently pair two different
          # workloads.
          #
          # `search`, not `match`: the digits are mid-string, so `match` would
          # anchor to the front and find nothing.
          pattern = re.compile(r"pyegui-(\d+)-t(\d+)\.json$")
          trials = {}
          for path in sorted(results.glob("pyegui-*.json")):
              m = pattern.search(path.name)
              if not m:
                  continue
              count, trial = int(m.group(1)), int(m.group(2))
              trials.setdefault(count, {})[trial] = json.loads(path.read_text())

          if not trials:
              # A single-trial run writes no -t suffix, so the runs recorded
              # before trials existed still combine. The Rust side is looked up
              # under both names, because assuming the suffixed one made a
              # legacy results directory fail with "missing Rust result".
              legacy = re.compile(r"pyegui-(\d+)\.json$")
              for path in sorted(results.glob("pyegui-*.json")):
                  m = legacy.search(path.name)
                  if m:
                      trials.setdefault(int(m.group(1)), {})[1] = json.loads(
                          path.read_text()
                      )

          if not trials:
              raise SystemExit("no benchmark results to combine")

          def median(values):
              return statistics.median(values)

          by_count = {}
          for count in sorted(trials):
              per_trial = []
              for trial in sorted(trials[count]):
                  pyegui = trials[count][trial]
                  egui_path = results / f"egui-{count}-t{trial}.json"
                  if not egui_path.exists():
                      # Trial 1 of a legacy single-trial run.
                      egui_path = results / f"egui-{count}.json"
                  if not egui_path.exists():
                      raise SystemExit(
                          f"missing Rust result for {count} widgets, trial {trial}"
                      )
                  egui = json.loads(egui_path.read_text())

                  # The two sides have drifted before (one repainted and one
                  # did not), so confirm they measured the same workload before
                  # comparing them. A ratio between different workloads is a
                  # meaningless number, and it looks like a real one.
                  for field in ("widgets_per_frame", "frames_measured"):
                      if pyegui[field] != egui[field]:
                          raise SystemExit(
                              f"{field} mismatch at {count} widgets, trial "
                              f"{trial}: pyegui measured {pyegui[field]}, egui "
                              f"measured {egui[field]} -- the ratio would be "
                              "comparing two different workloads"
                          )
                  if pyegui["widgets_per_frame"] != count:
                      raise SystemExit(
                          f"{pyegui['widgets_per_frame']} widgets recorded in a "
                          f"file named for {count}"
                      )

                  py_per = pyegui["per_widget_us"]["min"]
                  rs_per = egui["per_widget_us"]["min"]
                  per_trial.append(
                      {
                          "trial": trial,
                          "pyegui_us": py_per,
                          "egui_us": rs_per,
                          "ratio": round(py_per / rs_per, 3),
                          "extra_us": round(py_per - rs_per, 4),
                          "pyegui_first_frame_ms": pyegui["first_frame_ms"],
                          "egui_first_frame_ms": egui["first_frame_ms"],
                      }
                  )

              ratios = [r["ratio"] for r in per_trial]
              py_all = [r["pyegui_us"] for r in per_trial]
              rs_all = [r["egui_us"] for r in per_trial]

              # The median, not the mean: a shared runner has outliers, and one
              # slow trial drags a mean away from the typical case. The spread
              # is reported alongside because three runs of identical code gave
              # 1.30x, 1.52x and 1.38-1.55x, which is too wide to quote a single
              # figure without it.
              entry = {
                  "trials": len(per_trial),
                  "per_trial": per_trial,
                  "python": trials[count][sorted(trials[count])[0]],
                  "comparison": {
                      "ratio_median": round(median(ratios), 2),
                      "ratio_min": round(min(ratios), 2),
                      "ratio_max": round(max(ratios), 2),
                      "ratio_spread": round(max(ratios) - min(ratios), 2),
                      "pyegui_us_median": round(median(py_all), 3),
                      "egui_us_median": round(median(rs_all), 3),
                      "extra_us_median": round(
                          median([r["extra_us"] for r in per_trial]), 4
                      ),
                  },
              }
              if len(per_trial) > 1:
                  # Relative spread of the ratio: how much of the number is
                  # the measurement rather than the binding.
                  entry["comparison"]["ratio_spread_pct"] = round(
                      100.0 * (max(ratios) - min(ratios)) / median(ratios), 1
                  )
              by_count[str(count)] = entry

              c = entry["comparison"]
              if entry["trials"] > 1:
                  print(
                      f"{count} widgets/frame over {entry['trials']} trials: "
                      f"ratio median {c['ratio_median']}x "
                      f"(min {c['ratio_min']}x, max {c['ratio_max']}x, "
                      f"spread {c['ratio_spread_pct']}%)  "
                      f"per widget median {c['pyegui_us_median']} us vs "
                      f"{c['egui_us_median']} us"
                  )
              else:
                  print(
                      f"{count} widgets/frame, 1 trial: "
                      f"ratio {c['ratio_median']}x  "
                      f"per widget {c['pyegui_us_median']} us vs "
                      f"{c['egui_us_median']} us"
                  )

          combined = {"import": imp, "by_widget_count": by_count}
          (results / "combined.json").write_text(json.dumps(combined, indent=2))
          PY


      - name: Summarise
        run: |
          set -euo pipefail
          {
            echo "### pyegui vs egui"
            echo
            python - <<'PY'
          import json, pathlib
          c = json.loads((pathlib.Path("bench/results") / "combined.json").read_text())
          by_count = c["by_widget_count"]
          trials = max(e["trials"] for e in by_count.values())

          def us(value):
              # Fixed to 4 dp, not repr: a float straight out of json prints as
              # 0.049100000000000005, which is a binary fraction being displayed,
              # not a measurement. 1 ns is well past the noise here.
              return f"{value:.4f}".rstrip("0").rstrip(".") or "0"

          if trials > 1:
              print(f"Median of {trials} trials per widget count, all in this one run,")
              print("so the rows are comparable with each other.")
          else:
              print("One trial per widget count. Re-run with trials > 1 for a spread.")
          print()
          print("| widgets/frame | pyegui (us) | egui (us) | ratio median | ratio min-max | spread | extra (us) |")
          print("| ---: | ---: | ---: | ---: | ---: | ---: | ---: |")
          for count in sorted(by_count, key=int):
              e = by_count[count]
              c_ = e["comparison"]
              rng = f'{c_["ratio_min"]}x-{c_["ratio_max"]}x'
              spread = f'{c_["ratio_spread_pct"]}%' if "ratio_spread_pct" in c_ else "-"
              print(
                  f'| {count} '
                  f'| {us(c_["pyegui_us_median"])} '
                  f'| {us(c_["egui_us_median"])} '
                  f'| {c_["ratio_median"]}x '
                  f'| {rng} '
                  f'| {spread} '
                  f'| {us(c_["extra_us_median"])} |'
              )
          print()
          if trials > 1:
              print("Every trial, so the spread is visible rather than summarised:")
              print()
              print("| widgets/frame | trial | pyegui (us) | egui (us) | ratio |")
              print("| ---: | ---: | ---: | ---: | ---: |")
              for count in sorted(by_count, key=int):
                  for r in by_count[count]["per_trial"]:
                      print(
                          f'| {count} '
                          f'| {r["trial"]} '
                          f'| {us(r["pyegui_us"])} '
                          f'| {us(r["egui_us"])} '
                          f'| {r["ratio"]}x |'
                      )
              print()
          print(f'`import pyegui`: {us(c["import"]["import_pyegui_ms"])} ms (n/a for Rust)')
          PY
          } >> "$GITHUB_STEP_SUMMARY"


      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench/results

      # The artifact expires; a benchmark quoted in the README has to be
      # re-readable later without paying for another 25-minute run. The
      # combined file is committed, not the per-trial files: it is the one the
      # guide transcribes, and committing the rest would bury that under noise
      # on every run.
      #
      # GITHUB_TOKEN, deliberately. A PAT here would let this push trigger
      # further workflow runs, and the benchmark is manual and slow enough that
      # a run per run is a bill someone has to explain. The token's own push
      # is also the one push GitHub refuses to start workflows from, so
      # committing a snapshot cannot re-enter CI.
      - name: Commit the combined result
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The dispatch may leave HEAD detached or shallow, so the ref is
          # spelled out rather than inferred from the checkout.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/results/combined.json

          # Nothing to do when the numbers came out identical. An empty commit
          # on every run would be indistinguishable from a real change, which is
          # the opposite of what this step is for.
          if git diff --cached --quiet; then
            echo "combined.json is unchanged; not committing"
            exit 0
          fi

          git commit -m "Record benchmark result: ${GITHUB_RUN_ID}"
          # Not a plain `git push`: that publishes to whatever HEAD points at,
          # which under a detached or shallow checkout is not the branch that
          # was dispatched. The remote is ahead by nothing at this point, but
          # a ref that moves between dispatch and push must not clobber it.
          git push origin "HEAD:${REF}"