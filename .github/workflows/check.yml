# Fast compile/clippy gate for every push.
#
# CI.yml only runs on tags and PRs, which is the wrong feedback loop while
# porting egui features: we want a compile verdict on each push to the
# feature branch, in ~2 minutes, on one platform.
#
# This is the local-build substitute: nothing in this repo can be compiled
# without a Rust toolchain, so this job is the source of truth for "does it
# build".
name: check

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # pyegui pins egui exactly; keep the lockfile authoritative so CI resolves
  # the same crate graph locally and in CI.
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  check:
    name: cargo check + clippy (linux, python 3.11)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust (MSRV-aware)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-check

      # The real gate: if the Rust side does not compile, nothing else matters.
      - name: cargo check
        run: cargo check --locked --all-targets

      # Advisory for now: the pre-existing lib.rs carries ~19 clippy lints
      # (needless_borrow, needless_return, single_char_pattern, non_snake_case
      # on the RGB class, etc). Reporting without failing keeps this job a
      # regression gate -- "no NEW lints" -- while the backlog is worked down.
      # Promote to `-- -D warnings` once the baseline is clean.
      - name: cargo clippy (advisory)
        run: cargo clippy --locked --all-targets 2>&1 | tee clippy.log

      - name: Report clippy delta
        run: |
          set -euo pipefail
          count=$(grep -cE '^(warning|error)(\[|:)' clippy.log || true)
          echo "clippy diagnostic lines: ${count}"
          {
            echo "### clippy on pyegui"
            echo
            echo '```'
            grep -E '^(warning|error)(\[|:)' clippy.log | sort | uniq -c | sort -rn | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Confirms the lockfile still resolves with egui pinned to =0.31.1 and
      # that no transitive bump smuggled a newer egui in.
      - name: Verify pinned egui version
        run: |
          set -euo pipefail
          for crate in egui eframe egui_extras; do
            # --prefix none leaves no leading spaces, but normalise anyway so
            # the comparison cannot silently pass on a malformed line.
            resolved=$(cargo tree -p "${crate}" --depth 0 --prefix none \
                       | head -1 | tr -d '[:space:]')
            expected="${crate}v0.31.1"
            echo "resolved ${crate}: ${resolved}"
            if [ "${resolved}" != "${expected}" ]; then
              echo "::error::${crate} is not pinned to 0.31.1 (got ${resolved}, want ${expected})"
              exit 1
            fi
          done

      # Builds the extension module and imports it, which catches missing
      # #[pymodule] registrations that cargo check alone will not.
      # `maturin develop` needs an activated virtualenv; CI has none, so build
      # a wheel and install it into the runner's Python instead.
      - name: Build wheel and verify exports
        run: |
          set -euo pipefail
          pip install "maturin>=1.8,<2.0"
          maturin build --release --locked --out dist --find-interpreter
          pip install --find-links dist --force-reinstall pyegui

          python - <<'PY'
          import pyegui

          # Guard the registration of every exported name. New widgets must be
          # added here or this fails, which is the point.
          required = {
              # entrypoint
              "run_native",
              # every exported class
              "Bool", "Context", "Date", "Float", "Group", "Int", "Layout", "LayoutType",
              "PointerButton", "RGB", "Response", "Scope", "Str",
              # every exported plain widget / helper function
              "add_enabled", "add_space", "button_clicked", "centered_and_justified",
              "checkbox", "close_menu", "code", "code_editor", "collapsing",
              "color_edit_button_rgb", "combo_box", "date_picker_button", "disable",
              "drag_angle", "drag_angle_tau", "drag_float", "drag_int", "group",
              "heading", "horizontal", "horizontal_centered", "horizontal_top",
              "horizontal_wrapped", "hyperlink", "hyperlink_to", "image",
              "image_and_text_clicked", "indent", "label", "link_clicked", "monospace",
              "progress", "radio", "radio_value", "run_native", "scope",
              "scroll_area_horizontal", "scroll_area_vertical", "selectable_label",
              "selectable_value", "separator", "set_invisible", "set_opacity",
              "slider_float", "slider_int", "small", "small_button_clicked", "spinner",
              "strong", "text_edit_multiline", "text_edit_singleline", "toggle_value",
              "vertical", "vertical_centered", "vertical_centered_justified", "weak",
              # *_response variants wrapping egui::Response
              "button_response", "checkbox_response", "code_editor_response",
              "code_response", "color_edit_button_rgb_response",
              "date_picker_button_response", "drag_angle_response",
              "drag_angle_tau_response", "drag_float_response", "drag_int_response",
              "heading_response", "hyperlink_response", "hyperlink_to_response",
              "image_and_text_response", "image_response", "label_response",
              "link_response", "monospace_response", "progress_response",
              "radio_response", "radio_value_response", "selectable_label_response",
              "selectable_value_response", "separator_response", "slider_float_response",
              "slider_int_response", "small_button_response", "small_response",
              "spinner_response", "strong_response", "text_edit_multiline_response",
              "text_edit_singleline_response", "toggle_value_response", "weak_response"
          }
          missing = sorted(n for n in required if not hasattr(pyegui, n))
          assert not missing, f"missing exports: {missing}"

          functions = [n for n in dir(pyegui) if not n.startswith("_")]
          print(f"pyegui exports {len(functions)} public names")
          print(f"{len(required)} required names present")
          PY