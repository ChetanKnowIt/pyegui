# Run every example and guide in the repo, so none of them rots on a push.
#
# The export gate in check.yml proves the module imports and exposes the
# right names. This proves each shipped app actually runs: it opens a window,
# draws, and exits cleanly. An example that references a renamed function, or
# composes the frame the old way, fails here instead of failing for a user.
#
# Each app is run with a wall-clock bound and required to close its own window
# (see run_bounded in the harness below). An app that never closes is a hang,
# not a pass, so the timeout is part of what is being tested.
#
# Deliberately not screenshotting: this checks that examples run, not what they
# look like. screenshot.yml covers the gallery's appearance.

name: examples

on:
  push:
    branches:
      - 'main'
      - 'feature/**'
    paths:
      - 'examples/**'
      - 'guides/**'
      - 'debug.py'
      - 'tests/**'
      - 'README.md'
      # The docs state a name count and a shipped-function list, and
      # tests/doc_claims.py compares both against expected_exports.py. Editing
      # them without re-running that check is how the changelog came to
      # advertise functions that do not exist.
      - 'CHANGELOG.md'
      - 'docs/**'
      # The gate tests below read bench/results/combined.json, and
      # tests/test_scenario_names_agree.py compares bench/bench.py against
      # bench/src/main.rs -- so a change to either benchmark half, or to the
      # snapshot, must run this job. 'src/lib.rs' does not glob-match
      # bench/src/main.rs, so without this a push touching only a benchmark
      # ran cargo check (check.yml has no path filter) but not pytest, leaving
      # cross-language scenario-name duplication unguarded on exactly the
      # pushes most likely to cause it.
      - 'bench/**'
      - 'src/lib.rs'
      # The examples run against a wheel built from this lockfile, so a
      # dependency change is exactly when their verdict can move.
      - 'Cargo.lock'
      - '.github/workflows/examples.yml'
  pull_request:
    paths:
      - 'examples/**'
      - 'guides/**'
      - 'debug.py'
      - 'tests/**'
      - 'README.md'
      # The docs state a name count and a shipped-function list, and
      # tests/doc_claims.py compares both against expected_exports.py. Editing
      # them without re-running that check is how the changelog came to
      # advertise functions that do not exist.
      - 'CHANGELOG.md'
      - 'docs/**'
      # The gate tests below read bench/results/combined.json, and
      # tests/test_scenario_names_agree.py compares bench/bench.py against
      # bench/src/main.rs -- so a change to either benchmark half, or to the
      # snapshot, must run this job. 'src/lib.rs' does not glob-match
      # bench/src/main.rs, so without this a push touching only a benchmark
      # ran cargo check (check.yml has no path filter) but not pytest, leaving
      # cross-language scenario-name duplication unguarded on exactly the
      # pushes most likely to cause it.
      - 'bench/**'
      - 'src/lib.rs'
      # The examples run against a wheel built from this lockfile, so a
      # dependency change is exactly when their verdict can move.
      - 'Cargo.lock'
      - '.github/workflows/examples.yml'
  # Called by release.yml to re-verify a tagged commit. The ref input exists
  # because a reusable workflow otherwise checks out the caller's ref, and a
  # tag must be verified as itself rather than as whatever the branch holds.
  workflow_call:
    inputs:
      ref:
        description: 'Commit or tag to verify'
        required: false
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-examples:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Pin the interpreter, as check.yml does. Without this the job gets the
      # runner image's default python, and a wheel maturin tags
      # cp311-abi3-manylinux_2_35 has to satisfy that interpreter's platform
      # tags. It did not, and the error pip gives for that --
      #
      #   ERROR: pyegui-...whl is not a supported wheel on this platform
      #
      # -- names neither the interpreter nor the tags, which is what made this
      # take four runs to find. setup-python is the same fix check.yml relies
      # on and has been using all along.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Python, Xvfb and the software OpenGL stack
        run: |
          set -euo pipefail

          # A virtualenv, not the system interpreter.
          #
          # `sudo apt-get install` makes site-packages unwritable, so pip
          # falls back to a user install and then rejects the wheel maturin
          # builds:
          #
          #   Defaulting to user installation because normal site-packages is
          #   not writeable
          #   ERROR: pyegui-...-manylinux_2_35_x86_64.whl is not a supported
          #          wheel on this platform
          #
          # check.yml never sees this because it runs no apt-get at all. In a
          # venv the apt packages cannot influence where anything lands, which
          # is also what a local developer has, so the job tests the same layout
          # a person would.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils libgl1-mesa-dri mesa-utils \
            libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 libxinerama1 \
            imagemagick

          python -m venv .venv-ci
          # shellcheck disable=SC1091
          source .venv-ci/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.8,<2.0"
          # pytest runs the gate's own tests and the scenario-name agreement
          # tests. Without it in CI they are local-only, and the agreement tests
          # guard a duplication across two languages that is otherwise silent --
          # nothing else in the job would notice it drifting.
          python -m pip install pytest

          # Print what got installed, so a wheel that installs but is not the
          # one this branch would build fails here rather than as fourteen
          # unexplained per-example errors.
          maturin build --release --locked --out dist --find-interpreter

          # Install by path, not by name: `--find-links` depends on pip's
          # search path, and an unmatched glob would otherwise leave a stale
          # wheel in place and pass against the wrong build.
          wheel=$(ls -1 dist/pyegui-*.whl)
          echo "installing ${wheel}"
          python -m pip install --force-reinstall "${wheel}"

          # Fail here, loudly, if what got installed is not what `python` will
          # import -- rather than as 14 unrelated per-example failures later.
          python -c "import pyegui; print('pyegui', len(dir(pyegui)), 'names from', pyegui.__file__)"

      - name: Run every example
        env:
          DISPLAY: ':99'
        run: |
          set -uo pipefail

          # Same virtualenv the wheel was installed into above.
          # shellcheck disable=SC1091
          source .venv-ci/bin/activate

          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill $xvfb_pid 2>/dev/null || true' EXIT

          for _ in $(seq 1 50); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          xdpyinfo -display :99 >/dev/null

          # Documentation snippets, run first and in the same step as Xvfb.
          # Two of README.md's snippets used to show the pre-clean-break form
          # -- run_native drawing widgets with no container -- and no job
          # noticed, because no doc snippet is one of the apps. This executes
          # them for real, so a binding that no longer exists fails here on its
          # own name. It has to live in this step: the X server starts below,
          # and a separate step earlier in the job has no display to open a
          # window on.
          echo "::group::documentation snippets"
          doc_status=0
          python tests/doc_snippets.py || doc_status=$?

          # The docs also make claims about the module itself -- a name count,
          # a list of shipped functions -- and nothing checked those. The
          # changelog advertised Hsva, Hsl, Oklch and color_edit_oklch, none of
          # which have ever existed, and both files claimed 121 names while the
          # module exported 123. This derives the numbers from
          # tests/expected_exports.py instead of trusting the prose.
          python tests/doc_claims.py || doc_status=$?
          echo "::endgroup::"

          # The gate's own tests, plus the check that the two benchmark halves
          # agree on the scenario names. Run here rather than in check.yml
          # because the gate reads bench/results/combined.json, which check.yml
          # never has.
          #
          # Accumulated into doc_status like the doc checks above, NOT run bare:
          # this step is `set -uo pipefail` without `-e`, so a bare failing
          # command would print red output and the job would still go green.
          echo "::group::gate tests"
          python -m pytest tests/ -q || doc_status=$?
          echo "::endgroup::"

          # Discover the apps rather than listing them: a new example that is
          # not in the list would otherwise never run, which is the failure
          # this job exists to prevent.
          mapfile -t apps < <(python tests/smoke.py --list)

          if [ "${#apps[@]}" -eq 0 ]; then
            echo "::error::no examples found to run"
            exit 1
          fi

          echo "running ${#apps[@]} apps"

          failed=""
          for app in "${apps[@]}"; do
            echo "::group::${app}"
            if timeout --kill-after=5s 60s python tests/smoke.py "${app}"; then
              echo "ok ${app}"
            else
              status=$?
              if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
                echo "::error::${app} did not exit; it hung until the timeout"
              else
                echo "::error::${app} exited ${status}"
              fi
              failed="${failed} ${app}"
            fi
            echo "::endgroup::"
          done

          if [ "$doc_status" -ne 0 ]; then
            failed="${failed} documentation-snippets"
          fi

          if [ -n "$failed" ]; then
            echo "::error::these apps failed:${failed}"
            exit 1
          fi

          echo "all ${#apps[@]} apps ran"