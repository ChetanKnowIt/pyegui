# Regenerate Cargo.lock after a dependency change and upload it as an
# artifact, since this repo has no local Rust toolchain and `cargo update` needs
# network access.
#
# Manual only. This used to fire on every push to feature/**, which spent a
# runner on every commit to produce a lockfile nobody looked at: the resolution
# has not changed since the egui =0.31.1 pin, and it only moves when a
# dependency does. Deleting this is still the eventual goal -- TODO §7 plans to
# turn on egui_extras' syntect feature, which will need it once -- but until
# that lands it should cost nothing.
#
# To use it: run it from the Actions tab, then download the `lockfile`
# artifact and commit the Cargo.lock from it.
#
# Needed whenever Cargo.toml changes in a way the lockfile records -- a
# version bump, or a dependency change. `cargo check --locked` fails otherwise,
# so this is not optional housekeeping.
name: regen-lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Regenerate lockfile
        run: |
          set -euo pipefail

          # `cargo update -p pyegui` refreshes only this package's own entry in
          # the lockfile.
          #
          # It is deliberately NOT `cargo update --workspace`, which re-resolves
          # every dependency and produces a large unrelated diff. That was right
          # when the egui pins were being introduced, but it is wrong for the
          # common case now: bumping the version in Cargo.toml changes exactly
          # one line of the lockfile, and this is the change that matches.
          #
          # Run 37041017323 failed `cargo check --locked` with "cannot update the
          # lock file ... because --locked was passed" after the 0.5.1 version
          # bump, which is this step's whole reason to exist.
          cargo update -p pyegui

          echo "--- pyegui entry:"
          grep -A1 '^name = "pyegui"$' Cargo.lock | head -2

          echo "--- egui resolution (must still be exactly 0.31.1):"
          cargo tree -p egui --depth 0 --prefix none | head -1
          cargo tree -p eframe --depth 0 --prefix none | head -1
          cargo tree -p egui_extras --depth 0 --prefix none | head -1

      - name: Upload regenerated Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: lockfile
          path: Cargo.lock