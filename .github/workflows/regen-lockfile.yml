# Regenerate Cargo.lock after a dependency change and upload it as an
# artifact, since this repo has no local Rust toolchain and `cargo update` needs
# network access.
#
# Manual only. This used to fire on every push to feature/**, which spent a
# runner on every commit to produce a lockfile nobody looked at: the resolution
# has not changed since the egui =0.31.1 pin, and it only moves when a
# dependency does. Deleting this is still the eventual goal -- TODO §7 plans to
# turn on egui_extras' syntect feature, which will need it once -- but until
# that lands it should cost nothing.
#
# To use it: run it from the Actions tab, then download the `lockfile`
# artifact and commit the Cargo.lock from it.
name: regen-lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Regenerate lockfile
        run: |
          set -euo pipefail
          # Drop the old resolution so the new exact pins are honoured rather
          # than merged with stale caret-resolved entries.
          cargo update --workspace
          echo "--- egui resolution:"
          cargo tree -p egui --depth 0 --prefix none | head -1
          cargo tree -p eframe --depth 0 --prefix none | head -1
          cargo tree -p egui_extras --depth 0 --prefix none | head -1

      - name: Upload regenerated Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: lockfile
          path: Cargo.lock