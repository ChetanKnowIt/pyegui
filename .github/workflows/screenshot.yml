# Render the widget gallery and upload a PNG per page.
#
# Screenshots cannot be taken on a developer machine: pyegui has no local Rust
# toolchain, so the only build of this crate that exists anywhere is the one CI
# produces. This workflow is therefore both the build and the screenshot.
#
# It also serves as a smoke test. The export gate proves the module imports and
# exposes the right names; this proves the widgets actually render. A widget
# that compiles and imports but panics or draws nothing fails here.
#
# Not a gate on PRs or on every push: the images are checked in, so
# regenerating them for an unrelated Rust change is five minutes of wasted
# runner. This fires when the gallery or the widgets it draws actually change,
# and can always be run by hand with workflow_dispatch.
name: screenshot

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'examples/gallery.py'
      - 'src/lib.rs'
      - '.github/workflows/screenshot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshot-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gallery:
    name: render gallery pages
    runs-on: ubuntu-22.04
    # Backstop only. Each page is individually bounded (a wall-clock ceiling in
    # the gallery, plus `timeout` in the step), so reaching this means
    # something is wrong at a level neither of those can see -- a wedged
    # compositor, say. 20 minutes is ~8 pages x (6s render + 1s settle + slack).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-screenshot

      # eframe builds with the `glow` backend, which needs a real OpenGL
      # context. A bare Xvfb has no GL at all, so Mesa's software rasteriser
      # (llvmpipe via libgl1-mesa-dri) is what actually draws the pixels.
      # Without this the app opens a window and renders nothing.
      #
      # The X client libraries are not optional either. winit dlopen()s
      # libxkbcommon-x11.so and panics if it is missing, so an incomplete
      # runner image fails at window creation rather than at import.
      - name: Install Xvfb, software OpenGL and the X client libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1-mesa-dri \
            libglx-mesa0 \
            mesa-utils \
            x11-utils \
            x11-xkb-utils \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            libx11-6 \
            libxcursor1 \
            libxrandr2 \
            libxi6 \
            libxinerama1 \
            imagemagick

      - name: Build and install the wheel
        run: |
          set -euo pipefail
          # python -m pip, not bare pip: installing imagemagick above pulls
          # in a second, older interpreter, and bare pip can then belong
          # to a different one than `python`.
          python -m pip install "maturin>=1.8,<2.0"
          maturin build --release --locked --out dist --find-interpreter
          python -m pip install --find-links dist --force-reinstall pyegui

      - name: Verify the gallery imports
        run: python examples/gallery.py list

      # One window per page. Each run draws its page, sleeps to let the last
      # frame composite, and closes itself, so this is deterministic rather
      # than a sleep-and-hope race against the compositor.
      - name: Render each page and screenshot it
        env:
          DISPLAY: ':99'
        run: |
          set -euo pipefail

          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill $xvfb_pid 2>/dev/null || true' EXIT

          # Wait for the server to accept connections rather than sleeping a
          # fixed amount.
          for _ in $(seq 1 50); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          xdpyinfo -display :99 >/dev/null

          # Confirm there is a GL implementation before blaming the gallery.
          glxinfo -B 2>&1 | head -20 || true

          mkdir -p screenshots
          failed=""

          # Each page screenshots itself before closing its window. Capturing
          # the X root from here instead would photograph an empty desktop,
          # because the app has already exited by this point -- which is what
          # the first version did, and why every PNG came out blank.
          #
          # Per-page timeout is the second line of defence: the gallery bounds
          # itself with a wall-clock ceiling, but if that path ever breaks the
          # job would otherwise sit until GitHub's six-hour limit. 60s is
          # generous: a page renders for 6s plus a 1s settle.
          for page in $(python examples/gallery.py list); do
            echo "::group::rendering ${page}"
            if timeout --kill-after=5s 60s \
                 python "examples/gallery.py" "${page}" --out screenshots; then
              if [ ! -s "screenshots/${page}.png" ]; then
                echo "::error::page ${page} produced no screenshot"
                failed="${failed} ${page}"
              fi
            else
              status=$?
              if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
                echo "::error::page ${page} timed out and was killed"
              else
                echo "::error::page ${page} exited ${status}"
              fi
              failed="${failed} ${page}"
            fi
            echo "::endgroup::"
          done

          ls -la screenshots/

          if [ -n "${failed}" ]; then
            echo "::error::these pages failed to render:${failed}"
            exit 1
          fi

      # A page can render "successfully" while missing the thing it exists to
      # show. The overlays page passed the byte check with no modal at all,
      # because `modal()` returned is_top_modal -- True every frame -- so the
      # page closed its own modal on the first frame while the resize area
      # still drew. A blank-check cannot catch that; a minimum colour count and
      # a per-page size floor can do a little better, but neither is a
      # substitute for looking at the image.
      #
      # Distinct colours, not bytes: a sparse page legitimately compresses to
      # little, and ImageMagick is already installed here. tests/smoke.py uses
      # the same measure for the same reason.
      - name: Check the screenshots actually drew something
        run: |
          set -euo pipefail

          blank=""
          thin=""
          for png in screenshots/*.png; do
            size=$(stat -c%s "$png")
            colours=$(identify -format "%k" "$png")
            echo "${png}: ${size} bytes, ${colours} distinct colours"

            if [ "${colours}" -lt 4 ]; then
              blank="${blank} ${png}"
            fi
            # Each page is a full frame of widgets. A capture far below this
            # means most of the page failed to draw, which is how the missing
            # modal looked in the one case that got through.
            if [ "${size}" -lt 12000 ]; then
              thin="${thin} ${png}"
            fi
          done

          if [ -n "${blank}" ]; then
            echo "::error::these pages rendered blank:${blank}"
            exit 1
          fi
          if [ -n "${thin}" ]; then
            echo "::warning::these pages look thin, check them by eye:${thin}"
          fi

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gallery-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 30